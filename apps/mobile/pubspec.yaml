name: boothconnect_mobile
description: BoothConnect field app for volunteers (Android and iOS).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  dio: ^5.11.1
  drift: ^2.35.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^18.0.1
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (settings in l10n.yaml).
  generate: true

hooks:
  user_defines:
    sqlite3:
      # Bundle SQLCipher instead of plain SQLite, so the offline database
      # (Drift) can be encrypted. This replaces the retired
      # sqlcipher_flutter_libs package.
      source: sqlcipher
