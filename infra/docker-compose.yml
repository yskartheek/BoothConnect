# Local development services: Postgres 16, Redis 7 and MinIO (S3-compatible storage).
#
#   pnpm infra:up     start everything and wait until all services are healthy
#   pnpm infra:down   stop everything (data is kept in the named volumes)
#
# The roll-parser worker has the `roll-parser` profile, so it only runs when
# asked for (see apps/roll-parser/README.md):
#   docker compose -f infra/docker-compose.yml --profile roll-parser up -d --build roll-parser
#
# Settings come from the repository-root .env (template: infra/env/.env.example)
# when it exists. Every setting also has a development default, so this works
# without an .env file.
# Never reuse these defaults outside local development.

name: boothconnect

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boothconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boothconnect}
      POSTGRES_DB: ${POSTGRES_DB:-boothconnect}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Append-only file so queued jobs survive a restart
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # The official minio/minio images are no longer published, so we use the
  # community-maintained fork (same server, same console, same API).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-boothconnect}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-boothconnect-dev-secret}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot job: creates the bucket for import uploads, then exits.
  # Safe to run again: an existing bucket is left as it is.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-boothconnect}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-boothconnect-dev-secret}
      S3_BUCKET_IMPORTS: ${S3_BUCKET_IMPORTS:-boothconnect-imports}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET_IMPORTS"
        mc anonymous set none "local/$$S3_BUCKET_IMPORTS"
        echo "Bucket $$S3_BUCKET_IMPORTS is ready"

  # Python worker that extracts voter rows from roll PDFs (apps/roll-parser).
  # Takes `extract-roll` jobs from Redis and reads/writes the import bucket.
  # Not started by `pnpm infra:up`; see apps/roll-parser/README.md.
  roll-parser:
    profiles: ['roll-parser']
    build:
      context: ../apps/roll-parser
    image: boothconnect/roll-parser:dev
    pull_policy: build
    restart: unless-stopped
    command: ['worker']
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-boothconnect}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-boothconnect-dev-secret}
      S3_FORCE_PATH_STYLE: 'true'
      ROLL_PARSER_CONCURRENCY: ${ROLL_PARSER_CONCURRENCY:-1}
      ROLL_PARSER_TIMEOUT_SECONDS: ${ROLL_PARSER_TIMEOUT_SECONDS:-600}
    ports:
      - '${ROLL_PARSER_HEALTH_PORT:-8090}:8090'
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
