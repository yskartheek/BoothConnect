name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  # Decides which jobs below need to run. Pushes to main and manual runs
  # always run everything; pull requests only run jobs whose paths changed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js == 'true' || github.event_name != 'pull_request' }}
      api: ${{ steps.filter.outputs.api == 'true' || github.event_name != 'pull_request' }}
      web: ${{ steps.filter.outputs.web == 'true' || github.event_name != 'pull_request' }}
      mobile: ${{ steps.filter.outputs.mobile == 'true' || github.event_name != 'pull_request' }}
      roll-parser: ${{ steps.filter.outputs.roll-parser == 'true' || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - .nvmrc
              - .github/workflows/ci.yml
            js:
              - *shared
              - 'apps/api/**'
              - 'apps/admin-web/**'
              - 'packages/**'
              # Checked against tokens.json by the design-tokens tests.
              - 'apps/mobile/lib/theme/tokens.g.dart'
              # Checked against packages/i18n/locales by the i18n tests.
              - 'apps/mobile/lib/l10n/*.arb'
              - 'apps/mobile/lib/l10n/shared_labels.g.dart'
              - '**/*.md'
              - '**/*.json'
              - '**/*.{yml,yaml}'
              - '**/*.{js,mjs,cjs,ts,tsx,css}'
            api:
              - *shared
              - 'apps/api/**'
              - 'infra/**'
              - 'packages/eslint-config/**'
            web:
              - *shared
              - 'apps/admin-web/**'
              - 'packages/**'
            mobile:
              - .github/workflows/ci.yml
              - 'apps/mobile/**'
            roll-parser:
              - .github/workflows/ci.yml
              - 'apps/roll-parser/**'

  js:
    name: JS (format, lint, typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # docs/api/openapi.json must match the API code (regenerate with
      # `pnpm --filter api openapi`); the api-client tests check its types
      # against the spec.
      - name: OpenAPI spec is up to date
        run: pnpm --filter @boothconnect/api openapi:check
      # The Flutter app and the Python roll-parser have their own jobs below.
      - run: pnpm turbo run lint typecheck test build --filter=!@boothconnect/mobile --filter=!@boothconnect/roll-parser

  api-integration:
    name: API integration (Postgres + Redis)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boothconnect
          POSTGRES_PASSWORD: boothconnect
          POSTGRES_DB: boothconnect
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U boothconnect -d boothconnect"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://boothconnect:boothconnect@localhost:5432/boothconnect?schema=public
      REDIS_URL: redis://localhost:6379
      # Roll-import uploads (#44) go to MinIO; the tests create the bucket.
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: boothconnect
      S3_SECRET_ACCESS_KEY: boothconnect-dev-secret
      S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET_IMPORTS: boothconnect-imports
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # MinIO needs `server /data`, which service containers can't pass, so
      # it's started here (same image as infra/docker-compose.yml).
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/ready && exit 0
            sleep 2
          done
          docker logs minio
          exit 1
      # test:int migrates and seeds its own databases (test/global-setup-int.cjs)
      - run: pnpm --filter api test:int

  web-e2e:
    name: Admin web end-to-end (Playwright)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin-web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/admin-web/playwright-report/
          retention-days: 7

  mobile:
    name: Mobile (format, analyze, test)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Drift's generated code (*.g.dart) is committed: fail if it is stale.
      - run: dart run build_runner build
      - run: git diff --exit-code -- lib
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  roll-parser:
    name: Roll parser (lint, typecheck, test, integration)
    needs: changes
    if: needs.changes.outputs.roll-parser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      UV_VERSION: '0.12.19'
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: boothconnect
      S3_SECRET_ACCESS_KEY: boothconnect-dev-secret
      S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET_IMPORTS: boothconnect-imports
    steps:
      - uses: actions/checkout@v7
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version
      - name: Install uv
        run: pipx install "uv==${UV_VERSION}"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter roll-parser sync
      - run: pnpm turbo run lint typecheck test --filter=@boothconnect/roll-parser
      # MinIO needs `server /data`, which service containers can't pass, so
      # it's started here (same image as infra/docker-compose.yml).
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/ready && exit 0
            sleep 2
          done
          docker logs minio
          exit 1
      - name: Integration test (Redis + MinIO + worker)
        run: pnpm --filter roll-parser test:int
      - name: Build the Docker image and run its self-check
        run: |
          docker build -t boothconnect/roll-parser:ci apps/roll-parser
          docker run --rm boothconnect/roll-parser:ci check
