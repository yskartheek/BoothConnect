name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  # Decides which jobs below need to run. Pushes to main and manual runs
  # always run everything; pull requests only run jobs whose paths changed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js == 'true' || github.event_name != 'pull_request' }}
      api: ${{ steps.filter.outputs.api == 'true' || github.event_name != 'pull_request' }}
      web: ${{ steps.filter.outputs.web == 'true' || github.event_name != 'pull_request' }}
      mobile: ${{ steps.filter.outputs.mobile == 'true' || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - turbo.json
              - .nvmrc
              - .github/workflows/ci.yml
            js:
              - *shared
              - 'apps/api/**'
              - 'apps/admin-web/**'
              - 'packages/**'
              - '**/*.md'
              - '**/*.json'
              - '**/*.{yml,yaml}'
              - '**/*.{js,mjs,cjs,ts,tsx,css}'
            api:
              - *shared
              - 'apps/api/**'
              - 'packages/eslint-config/**'
            web:
              - *shared
              - 'apps/admin-web/**'
              - 'packages/**'
            mobile:
              - .github/workflows/ci.yml
              - 'apps/mobile/**'

  js:
    name: JS (format, lint, typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # The Flutter app has its own job below.
      - run: pnpm turbo run lint typecheck test build --filter=!@boothconnect/mobile

  api-integration:
    name: API integration (Postgres + Redis)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boothconnect
          POSTGRES_PASSWORD: boothconnect
          POSTGRES_DB: boothconnect
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U boothconnect -d boothconnect"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://boothconnect:boothconnect@localhost:5432/boothconnect?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api test:int

  web-e2e:
    name: Admin web end-to-end (Playwright)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin-web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/admin-web/playwright-report/
          retention-days: 7

  mobile:
    name: Mobile (format, analyze, test)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
